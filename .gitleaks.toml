# Secret scan for this repository: gitleaks default rules plus chat-channel
# credentials and identifiers. CI runs it on every push and pull request.
title = "PULSE secret scan"

[extend]
useDefault = true

[[rules]]
id = "telegram-bot-token"
description = "Telegram bot token"
regex = '''\b[0-9]{8,10}:AA[A-Za-z0-9_-]{33}\b'''
keywords = [":aa"]

[[rules]]
id = "feishu-user-or-chat-id"
description = "Feishu/Lark open_id, chat_id or union_id"
regex = '''\b(?:ou|oc|on)_[0-9a-f]{32}\b'''
keywords = ["ou_", "oc_", "on_"]
[[rules.allowlists]]
regexes = ['''_0{24}[0-9a-f]{8}$''']

[[rules]]
id = "feishu-app-id"
description = "Feishu/Lark app id"
regex = '''\bcli_[0-9a-f]{16}\b'''
keywords = ["cli_"]
[[rules.allowlists]]
regexes = ['''^cli_0{8}[0-9a-f]{8}$''']

[[rules]]
id = "sk-api-key"
description = "sk- style API key (OpenAI, Anthropic, OpenRouter, DeepSeek)"
regex = '''\bsk-(?:proj-|ant-[a-z0-9]+-|or-v1-)?[A-Za-z0-9_]{32,}\b'''
keywords = ["sk-"]

[[rules]]
id = "tailscale-address"
description = "Tailscale (CGNAT 192.0.2.1/10) address"
regex = '''\b100\.(?:6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3}\b'''
keywords = ["100."]

[[rules]]
id = "private-network-address"
description = "RFC 1918 private address"
regex = '''\b(?:10\.[0-9]{1,3}|172\.(?:1[6-9]|2[0-9]|3[01])|192\.168)\.[0-9]{1,3}\.[0-9]{1,3}\b'''
keywords = ["10.", "172.", "192.168."]

[[rules]]
id = "email-address"
description = "Email address outside reserved example domains"
regex = '''\b[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}\b'''
keywords = ["@"]
[[rules.allowlists]]
regexes = ['''(?i)@(?:[a-z0-9-]+\.)*(?:example\.(?:com|org|net)|example|invalid|test|local|localhost)$''', '''(?i)noreply''', '''(?i)@github\.com$''']

[[allowlists]]
description = "Synthetic values in tests"
targetRules = ["generic-api-key"]
regexes = ['''^img_v3_0123456789abcdef''', '''^sk-or-v1-(?:explicit|unselected)-''', '''^ho-fixture-''', '''^f549314eaf0c2daa''', '''^0123456789abcdef0123456789abcdef\.''']
